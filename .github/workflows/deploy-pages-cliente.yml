name: Deploy client catalog to GitHub Pages

on:
  push:
    branches: [Cliente]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client branch
        uses: actions/checkout@v4
        with:
          ref: Cliente

      - name: Verify authentication bridge
        shell: bash
        run: |
          grep -q "return')!=='loja'" gerenciar.html
          grep -q 'catalogopapeldeparede.fabrikakriativa.com.br' gerenciar.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
