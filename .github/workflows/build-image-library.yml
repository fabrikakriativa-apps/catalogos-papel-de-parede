name: Build image library

on:
  push:
    branches: [main]
    paths:
      - 'dados/colecoes/**'
      - 'scripts/build_library.py'
      - 'scripts/build_library_v2.py'
      - 'scripts/build_wiler.py'
      - 'scripts/patch_home_finish.py'
      - 'scripts/import_bio_pdf_images.py'
      - 'staging/**'
      - '.github/workflows/build-image-library.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_kantai:
    if: github.event_name == 'issues' || contains(github.event.head_commit.message, '[KANTAI EXPORT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Kantai originals
        uses: actions/upload-artifact@v4
        with:
          name: kantai-originals
          path: imagens/kantai/**/originals/*.jpg
          if-no-files-found: error
          retention-days: 1

  import_bio_pdf:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[HF PDF IMPORT]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      - name: Expand BIO Habitat PDF image chunks
        run: |
          shopt -s nullglob
          archives=(staging/bio-habitat-pdf-*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No BIO Habitat PDF import archives found"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            echo "Expanding $archive"
            unzip -o "$archive" -d .
          done

      - name: Build BIO Habitat thumbnails and patch manifest
        run: python scripts/import_bio_pdf_images.py

      - name: Commit BIO Habitat PDF import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f staging/bio-habitat-pdf-*.zip
          git add -A imagens/home-finish/bio-habitat
          git add -A dados/biblioteca-imagens.json
          git add -A staging
          if git diff --cached --quiet; then
            echo "No BIO Habitat PDF import changes"
          else
            git commit -m "[KANTAI EXPORT] Import BIO Habitat images from official PDF"
            git push
          fi

  build:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[KANTAI EXPORT]') && !contains(github.event.head_commit.message, '[HF PDF IMPORT]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4

      - name: Patch only Home Finish problem images
        if: contains(github.event.head_commit.message, '[HF PATCH]')
        run: python scripts/patch_home_finish.py

      - name: Commit Home Finish patch
        if: contains(github.event.head_commit.message, '[HF PATCH]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d imagens/home-finish ]; then git add -A imagens/home-finish; fi
          git add -A dados/biblioteca-imagens.json
          if git diff --cached --quiet; then
            echo "No Home Finish patch changes"
          else
            git commit -m "Patch Home Finish problem images"
            git push
          fi

      - name: Upload Home Finish patch images
        if: contains(github.event.head_commit.message, '[HF PATCH]')
        uses: actions/upload-artifact@v4
        with:
          name: home-finish-patch-images
          path: |
            imagens/home-finish/bio-habitat/originals/*.jpg
            imagens/home-finish/bio-habitat/thumbnails/*.jpg
          if-no-files-found: error
          retention-days: 1

      - name: Expand staged PDF collections
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          if compgen -G "staging/*.zip" > /dev/null; then
            for archive in staging/*.zip; do
              echo "Expanding $archive"
              unzip -o "$archive" -d .
              rm "$archive"
            done
          fi

      - name: Build Home Finish and Kantai library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: python scripts/build_library_v2.py

      - name: Commit Home Finish and Kantai library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d imagens ]; then git add -A imagens; fi
          git add -A dados/biblioteca-imagens.json
          if [ -d staging ]; then git add -A staging; fi
          if git diff --cached --quiet; then
            echo "No Home Finish/Kantai changes"
          else
            git commit -m "Build Home Finish and Kantai image library"
            git push
          fi

      - name: Build Wiler library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: python scripts/build_wiler.py

      - name: Commit Wiler library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          if [ -d imagens/wiler ]; then git add -A imagens/wiler; fi
          git add -A dados/biblioteca-imagens.json
          if [ -d staging ]; then git add -A staging; fi
          if git diff --cached --quiet; then
            echo "No Wiler changes"
          else
            git commit -m "Build Wiler image library"
            git push
          fi
